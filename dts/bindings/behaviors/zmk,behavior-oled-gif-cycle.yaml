description: |
  OLED image / animated GIF cycle behavior.
  Pressing this key cycles to the next image or animated GIF on the OLED.
  Uses BEHAVIOR_LOCALITY_GLOBAL so both halves of a split keyboard respond.

compatible: "zmk,behavior-oled-gif-cycle"

include: one_param.yaml
