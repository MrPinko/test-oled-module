description: |
  OLED display toggle behavior.
  Pressing this key will turn the OLED display on or off.
  Use BEHAVIOR_LOCALITY_GLOBAL so both halves of a split
  keyboard respond to the toggle together.

compatible: "zmk,behavior-oled-toggle"

include: zero_param.yaml